name: Build Dev Docker Image

on:
  push:
    branches: [ sina/dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python for endpoint tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: endpoint/requirements-dev.txt

      - name: Run endpoint tests
        run: |
          pip install -r endpoint/requirements-dev.txt
          pytest endpoint/tests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./endpoint/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: moghaddas/macless-haystack:dev,moghaddas/macless-haystack:dev-${{ github.sha }}
