services:
  anisette:
    image: dadoum/anisette-v3-server
    container_name: anisette
    restart: always
    # No `ports:` mapping: only macless-haystack talks to this service, over the
    # compose-internal network at http://anisette:6969. Publishing 6969 to the
    # host would expose an unauthenticated anisette server to the LAN/WAN for
    # no functional benefit.
    volumes:
      - anisette-v3_data:/home/Alcoholic/.config/anisette-v3

  macless-haystack:
    image: moghaddas/macless-haystack:dev
    container_name: macless-haystack
    restart: unless-stopped
    depends_on:
      - anisette
    ports:
      - "6176:6176"
    volumes:
      - mh_data:/app/endpoint/data
    stdin_open: true
    tty: true

volumes:
  anisette-v3_data:
  mh_data:
